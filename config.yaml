# 코사인 유사도. WeSpeaker CLI의 (cos+1)/2 점수가 아니다.
# 등록 성우가 한 명이면 margin은 쓰지 않고 임계값만 본다.
thresholds:
  ecapa_min: 0.70
  wespeaker_min: 0.65
  margin: 0.05

# ECAPA 응집 군집화. 코사인 거리 = 1 - 코사인 유사도. average linkage.
clustering:
  distance_threshold: 0.40

# htdemucs_ft는 이미 4개 모델의 평균이다. shifts를 올리면 더 느리게 한 번 더 평균한다.
demucs:
  model: htdemucs_ft
  shifts: 0

models:
  ecapa: speechbrain/spkrec-ecapa-voxceleb
  # wespeaker 공개 가중치. english = VoxCeleb ResNet221_LM
  wespeaker: english
  diarization: pyannote/speaker-diarization-3.1

# auto | cpu | cuda
device: auto
